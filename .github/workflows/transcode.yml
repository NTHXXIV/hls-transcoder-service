name: HLS Transcoder Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [build-hls]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Mask Sensitive Fields
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "::add-mask::${{ github.event.client_payload.callback_url }}"
          echo "::add-mask::${{ github.event.client_payload.callback_client_id }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  transcode:
    if: github.event_name == 'repository_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Mask Sensitive Fields
        run: |
          echo "::add-mask::${{ github.event.client_payload.callback_url }}"
          echo "::add-mask::${{ github.event.client_payload.callback_client_id }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Transcoder
        env:
          TRANSCODER_PRIVATE_KEY: ${{ secrets.TRANSCODER_PRIVATE_KEY }}
          HLS_CALLBACK_SECRET: ${{ secrets.HLS_CALLBACK_SECRET }}
          ALLOWED_CALLBACK_DOMAINS: ${{ secrets.ALLOWED_CALLBACK_DOMAINS }}
          HLS_CALLBACK_SECRET_STAGAPPS_SANDBOX: ${{ secrets.HLS_CALLBACK_SECRET_STAGAPPS_SANDBOX }}
          HLS_CALLBACK_SECRET_STAGAPPS_PROD: ${{ secrets.HLS_CALLBACK_SECRET_STAGAPPS_PROD }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          # Ghi payload ra file thông qua biến môi trường để tránh lộ log
          node -e "require('fs').writeFileSync('payload.json', process.env.CLIENT_PAYLOAD)"

          # Chạy transcoder với file payload
          npx tsx src/hls/index.ts payload.json

          rm -f payload.json
