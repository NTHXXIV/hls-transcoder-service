name: Media Transcription (Gemini Clean)

on:
  repository_dispatch:
    types: [build-transcription-clean]

jobs:
  clean:
    name: Gemini Cleaning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Mask Sensitive Fields
        run: |
          echo "::add-mask::${{ github.event.client_payload.callback_url }}"
          echo "::add-mask::${{ github.event.client_payload.callback_client_id }}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run Gemini Clean
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          HLS_CALLBACK_SECRET: ${{ secrets.HLS_CALLBACK_SECRET }}
          ALLOWED_CALLBACK_DOMAINS: ${{ secrets.ALLOWED_CALLBACK_DOMAINS }}
          HLS_CALLBACK_SECRET_STAGAPPS_SANDBOX: ${{ secrets.HLS_CALLBACK_SECRET_STAGAPPS_SANDBOX }}
          HLS_CALLBACK_SECRET_STAGAPPS_PROD: ${{ secrets.HLS_CALLBACK_SECRET_STAGAPPS_PROD }}
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          node -e "require('fs').writeFileSync('payload.json', process.env.PAYLOAD_JSON)"
          npx tsx src/transcribe/index.ts payload.json --clean
          rm -f payload.json
